plugins {
    id 'com.android.application'
}

android {
    namespace 'edu.xawl.xiaowuzhili'
    compileSdk 35

    defaultConfig {
        applicationId "edu.xawl.xiaowuzhili"
        minSdk 24
        targetSdk 35
        versionCode 95
        versionName "1.037"
    }

    signingConfigs {
        release {
            storeFile file("xiaowu-release.jks")
            storePassword "xiaowu2026"
            keyAlias "xiaowu"
            keyPassword "xiaowu2026"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
